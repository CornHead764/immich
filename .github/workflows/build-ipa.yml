name: Build IPA

# Fork-only workflow: builds an unsigned IPA for sideloading through SideStore.
#
# A push to the working branch builds and keeps the IPA as an artifact; only a
# tag publishes a release. Releases are tagged in their own `ipa-v*` namespace
# rather than `v*` because upstream's cli.yml and docker.yml fire on
# `release: published`, and the separation makes it obvious which releases are
# this fork's.
#
# release-ipa.sh pushes the branch and the tag at the same commit, so a release
# does build twice. That is the price of being able to prove a change to this
# workflow — or to the iOS code — without spending a version number on it.
on:
  push:
    branches: ['ios-background-upload']
    tags: ['ipa-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise's monorepo support — `monorepo_root` in the root mise.toml and the
  # `//mobile:task` syntax below — is behind the experimental flag.
  MISE_EXPERIMENTAL: 1

jobs:
  build:
    name: Build unsigned IPA
    # Flutter drives xcodebuild for iOS, so this has to run on macOS. The xtool
    # runner the other apps in this store build on handles SwiftPM packages
    # only and cannot build a Flutter app.
    #
    # The runner image and the Xcode below are the pair upstream's own
    # build-mobile.yml uses. An older Xcode is not worth trying: the project is
    # only ever built against this one.
    runs-on: macos-26

    steps:
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          working_directory: ./mobile

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Use identifiers this fork owns
        # group.app.immich.share is registered to upstream's team, and App Group
        # ids are globally unique, so no other account can ever be granted it.
        # The app reads its group from the AppGroupId key baked into Info.plist,
        # so the id has to be replaced at build time, not at signing time.
        # ios/Signing.xcconfig includes this file last, and it is gitignored.
        env:
          BUNDLE_ID: ${{ vars.IMMICH_BUNDLE_ID_PROD || 'co.lody.immich' }}
          GROUP_ID: ${{ vars.IMMICH_GROUP_ID || 'group.co.lody.immich' }}
        run: |
          set -euo pipefail
          {
            echo "IMMICH_BUNDLE_ID_PROD = $BUNDLE_ID"
            echo "IMMICH_GROUP_ID = $GROUP_ID"
          } > mobile/ios/Signing.local.xcconfig
          echo "Building as $BUNDLE_ID in $GROUP_ID"

      - name: Build unsigned app
        working-directory: ./mobile
        # SideStore signs the app with the user's own certificate on install, so
        # nothing is signed here. If xcodebuild starts demanding provisioning
        # profiles for the app or its extensions, blank IMMICH_TEAM_ID by
        # writing ios/Signing.local.xcconfig before this step.
        run: flutter build ios --release --no-codesign

      - name: Embed entitlements
        # --no-codesign leaves the app with no signature, and therefore no
        # entitlements blob at all. A re-signer reads entitlements out of the
        # binary it is given, so without this the installed app is granted none
        # of them: no shared container, which kills the widget, the share
        # extension, and the login cookie that lives in the group's cookie jar.
        # An ad-hoc signature is not honoured by iOS itself; it exists purely so
        # the entitlements survive as far as SideStore.
        env:
          GROUP_ID: ${{ vars.IMMICH_GROUP_ID || 'group.co.lody.immich' }}
        run: |
          set -euo pipefail
          APP=$(find mobile/build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)

          # The checked-in entitlements reference $(CUSTOM_GROUP_ID), which only
          # Xcode expands, and only when it is signing. Expand it here so these
          # files stay the single source of truth for what the app asks for.
          # applinks is dropped: my.immich.app belongs to upstream, and asking
          # for a domain the signing account cannot claim risks the whole
          # provisioning step rather than just losing universal links.
          expand() {
            python3 - "$1" "$2" "$GROUP_ID" <<'PY'
          import re, sys
          src, dst, group = sys.argv[1], sys.argv[2], sys.argv[3]
          x = open(src).read().replace('$(CUSTOM_GROUP_ID)', group)
          x = re.sub(r'\s*<key>com\.apple\.developer\.associated-domains</key>\s*<array>.*?</array>',
                     '', x, flags=re.S)
          open(dst, 'w').write(x)
          PY
          }
          expand mobile/ios/Runner/Runner.entitlements app.entitlements
          expand mobile/ios/ShareExtension/ShareExtension.entitlements share.entitlements
          expand mobile/ios/WidgetExtension/WidgetExtension.entitlements widget.entitlements

          # Deepest first: signing a bundle requires the code nested in it to
          # already carry a signature of its own.
          find "$APP/Frameworks" -name '*.framework' -maxdepth 1 -exec codesign --force --sign - {} +
          codesign --force --sign - --entitlements share.entitlements "$APP/PlugIns/ShareExtension.appex"
          codesign --force --sign - --entitlements widget.entitlements "$APP/PlugIns/WidgetExtension.appex"
          codesign --force --sign - --entitlements app.entitlements "$APP"

          # Silently losing an entitlement produces an app that installs, runs,
          # and quietly cannot keep you logged in, so prove it landed instead of
          # trusting that codesign did what it was asked.
          for target in "$APP/Immich" "$APP/PlugIns/ShareExtension.appex/ShareExtension" "$APP/PlugIns/WidgetExtension.appex/WidgetExtension"; do
            # Asking codesign is authoritative; grepping the binary is the
            # fallback, since the blob is embedded as plain XML either way and
            # the exact codesign flags vary between toolchains.
            if ! codesign -d --entitlements - "$(dirname "$target")" 2>/dev/null | grep -q "$GROUP_ID" \
               && ! grep -aq "$GROUP_ID" "$target"; then
              echo "error: $target carries no $GROUP_ID app-group entitlement." >&2
              exit 1
            fi
          done
          echo "All three targets carry the $GROUP_ID app group."

      - name: Package IPA
        # An IPA is just a zip with the .app under Payload/. `flutter build ipa`
        # is not usable here because it archives and exports, which requires a
        # signing identity.
        run: |
          set -euo pipefail
          BUILD=mobile/build/ios/iphoneos
          # The Release configuration sets PRODUCT_NAME = Immich, so the bundle
          # is not named after the Runner target that builds it. Found rather
          # than spelled out, and loud about what is actually there if it moves.
          APP=$(find "$BUILD" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "error: no .app in $BUILD" >&2
            ls -la "$BUILD" >&2 || true
            exit 1
          fi
          mkdir -p "$BUILD/Payload"
          mv "$APP" "$BUILD/Payload/"
          (cd "$BUILD" && zip -qry "$GITHUB_WORKSPACE/Immich.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/Immich.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Immich.ipa
          path: Immich.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ipa-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#ipa-v}"
          gh release create "$GITHUB_REF_NAME" Immich.ipa \
            --title "$GITHUB_REF_NAME" \
            --notes "Immich $VERSION — unsigned build for SideStore."

      # The SideStore source lives in Cory/sidestore on the Forgejo instance and
      # rebuilds itself from this repo's public releases, so nothing is ever
      # committed back here. This step only makes that rebuild happen sooner,
      # and is optional by design: the source repo also runs on a schedule, so a
      # release with no token here is picked up on its own, just later.
      - name: Refresh the SideStore source
        if: startsWith(github.ref, 'refs/tags/ipa-v')
        env:
          STORE_DISPATCH_TOKEN: ${{ secrets.STORE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_DISPATCH_TOKEN:-}" ]; then
            echo "No STORE_DISPATCH_TOKEN set — the source repo will pick up $GITHUB_REF_NAME on its next scheduled run."
            exit 0
          fi
          # The public address, not the in-cluster :3000 one the Forgejo jobs
          # use: this runner is outside that docker network.
          curl -fsS -X POST \
            -H "Authorization: token $STORE_DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://git.lody.co/api/v1/repos/Cory/sidestore/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Triggered Cory/sidestore update for $GITHUB_REF_NAME"
